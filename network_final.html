<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .header {
            padding: 60px 40px;
            background: white;
            border-bottom: 1px solid #e8e8e8;
            margin-bottom: 40px;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 16px;
            color: #666;
            font-weight: 400;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            padding: 12px 16px;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: white;
            transition: all 0.2s;
        }

        .search-box:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 2px rgba(26, 26, 26, 0.05);
        }

        .filter-btn {
            padding: 10px 16px;
            border: 1px solid #e8e8e8;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .filter-btn:hover {
            border-color: #1a1a1a;
        }

        .filter-btn.active {
            background: #1a1a1a;
            color: white;
            border-color: #1a1a1a;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }

        .stat {
            padding: 20px;
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            text-align: left;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 13px;
            color: #666;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .contacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 60px;
        }

        .contact-card {
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            padding: 20px;
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 240px;
        }

        .contact-card:hover {
            border-color: #1a1a1a;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .contact-name {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            word-break: break-word;
            margin: 0;
        }

        .contact-title {
            font-size: 14px;
            color: #555;
            font-weight: 500;
            line-height: 1.5;
            flex-grow: 1;
        }

        .contact-title-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #999;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .contact-company {
            font-size: 13px;
            color: #777;
            font-weight: 400;
            line-height: 1.4;
        }

        .contact-handle {
            font-size: 11px;
            color: #999;
            word-break: break-all;
            font-family: 'Monaco', 'Courier New', monospace;
            font-weight: 400;
        }

        .badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge.calendar {
            background: #e8f0ff;
            color: #0052cc;
        }

        .badge.imessage {
            background: #f0e8ff;
            color: #6f00cc;
        }

        .contact-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
            font-size: 12px;
            color: #999;
            margin-top: auto;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
        }

        .meta-label {
            opacity: 0.7;
        }

        .meta-value {
            font-weight: 500;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty p {
            font-size: 16px;
        }

        footer {
            padding: 40px;
            text-align: center;
            color: #999;
            font-size: 13px;
            border-top: 1px solid #e8e8e8;
            margin-top: 60px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 20px;
            }

            .header {
                padding: 40px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .contacts-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 12px;
            }

            .controls {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }
        }
    </style>
</head>

        let filteredContacts = [...allContacts];
        let currentFilter = 'all';

        function updateStats() {
            const calendar = allContacts.filter(c => c.types.includes('Calendar')).length;
            const imessage = allContacts.filter(c => c.types.includes('iMessage')).length;
            const both = allContacts.filter(c => c.types.length > 1).length;
            const withCompany = allContacts.filter(c => c.company && c.company !== '\u2014').length;

            document.getElementById('calendarCount').textContent = calendar - both;
            document.getElementById('imessageCount').textContent = imessage - both;
            document.getElementById('companyCount').textContent = withCompany;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function renderContacts() {
            const container = document.getElementById('contactsContainer');

            if (filteredContacts.length === 0) {
                container.innerHTML = '<div class="empty"><p>No contacts found</p></div>';
                return;
            }

            container.innerHTML = filteredContacts.map(contact => `
                <div class="contact-card">
                    <div class="contact-name">${contact.name}</div>
                    <div>
                        <div class="contact-title-label">Title</div>
                        <div class="contact-title">${contact.title}</div>
                    </div>
                    ${contact.company && contact.company !== '\u2014' ? `<div class="contact-company">${contact.company}</div>` : ''}
                    <div class="contact-handle">${contact.handle}</div>
                    <div class="badges">
                        ${contact.types.map(t => `<span class="badge ${t.toLowerCase()}">${t}</span>`).join('')}
                    </div>
                    <div class="contact-meta">
                        <div class="meta-row">
                            <span class="meta-label">Last contact:</span>
                            <span class="meta-value">${formatDate(contact.last_date)}</span>
                        </div>
                        ${contact.message_count ? `<div class="meta-row"><span class="meta-label">Messages:</span><span class="meta-value">${contact.message_count}</span></div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function applyFilter() {
            filteredContacts = allContacts.filter(contact => {
                const matchesFilter = currentFilter === 'all' ||
                    (currentFilter === 'both' && contact.types.length > 1) ||
                    (currentFilter === 'calendar' && contact.types.includes('Calendar') && contact.types.length === 1) ||
                    (currentFilter === 'imessage' && contact.types.includes('iMessage') && contact.types.length === 1);

                const matchesSearch =

                    contact.handle.toLowerCase().includes(searchTerm) ||
                    contact.title.toLowerCase().includes(searchTerm) ||

                return matchesFilter && matchesSearch;
            });

            renderContacts();
        }

                document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
